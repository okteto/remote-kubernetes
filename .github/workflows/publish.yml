name: publish-marketplace
permissions:
  contents: read
on:
  release:
    types: 
    - published
    - edited
  # Manual dry run of trusted publishing (OIDC). It must stay in this file:
  # the Marketplace trusted publisher is bound to the workflow file name.
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm run ci
    - name: publish
      if: github.event.release.prerelease != true
      run: pnpm run publish
    - name: publish-prerelease
      if: github.event.release.prerelease == true
      run: pnpm run publish-prerelease

  verify-oidc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - name: Verify trusted publishing (no publish)
      run: node scripts/verify-oidc.js
